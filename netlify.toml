# StoryFlow AI — Netlify Functions gateway (functions-only deployment).
# The Base44 app hosts the frontend + database; Netlify hosts the secure API
# functions only (fal.ai). FAL_KEY is set in Netlify environment variables ONLY
# and never appears in the frontend, database, or client responses.

[build]
  command = "echo 'StoryFlow AI functions-only deployment'"
  publish = "src/netlify/public"

[functions]
  directory = "src/netlify/functions"
  # Function timeout uses Netlify's plan default (10s free / 26s Pro). The scalar
  # "timeout" key is no longer valid in current netlify.toml schema, so it is
  # omitted here. If analysis times out, upgrade the Netlify plan for a higher
  # default timeout.

[build.environment]
  NODE_VERSION = "20"

# Guarantee CORS on every function response (browser would otherwise block
# cross-origin calls with "Failed to fetch"). Functions also set these headers.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
